name: dal-obscura-production

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    read_only: true
    tmpfs:
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true

  migrate:
    image: ${DAL_OBSCURA_IMAGE:?set DAL_OBSCURA_IMAGE}
    env_file: .env
    command: ["dal-obscura-migrate", "upgrade"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true

  control-plane:
    image: ${DAL_OBSCURA_IMAGE:?set DAL_OBSCURA_IMAGE}
    env_file: .env
    command: ["control-plane"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8820"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

  data-plane:
    image: ${DAL_OBSCURA_IMAGE:?set DAL_OBSCURA_IMAGE}
    env_file: .env
    command: ["data-plane"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8815"
      - "8816"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

  ui:
    image: ${DAL_OBSCURA_UI_IMAGE:?set DAL_OBSCURA_UI_IMAGE}
    depends_on:
      - control-plane
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
