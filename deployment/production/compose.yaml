name: dal-obscura-production

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      DAL_OBSCURA_MIGRATION_DB_PASSWORD: ${DAL_OBSCURA_MIGRATION_DB_PASSWORD:?set DAL_OBSCURA_MIGRATION_DB_PASSWORD}
      DAL_OBSCURA_CONTROL_PLANE_DB_PASSWORD: ${DAL_OBSCURA_CONTROL_PLANE_DB_PASSWORD:?set DAL_OBSCURA_CONTROL_PLANE_DB_PASSWORD}
      DAL_OBSCURA_DATA_PLANE_DB_PASSWORD: ${DAL_OBSCURA_DATA_PLANE_DB_PASSWORD:?set DAL_OBSCURA_DATA_PLANE_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    read_only: true
    tmpfs:
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "2G"

  migrate:
    image: ${DAL_OBSCURA_IMAGE:?set DAL_OBSCURA_IMAGE}
    environment:
      DAL_OBSCURA_DATABASE_URL: ${DAL_OBSCURA_MIGRATION_DATABASE_URL:?set DAL_OBSCURA_MIGRATION_DATABASE_URL}
    command: ["dal-obscura-migrate", "upgrade"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: "no"
    read_only: true
    user: "10001:10001"
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

  control-plane:
    image: ${DAL_OBSCURA_IMAGE:?set DAL_OBSCURA_IMAGE}
    environment:
      DAL_OBSCURA_DATABASE_URL: ${DAL_OBSCURA_CONTROL_PLANE_DATABASE_URL:?set DAL_OBSCURA_CONTROL_PLANE_DATABASE_URL}
      DAL_OBSCURA_CONTROL_PLANE_PROFILE: ${DAL_OBSCURA_CONTROL_PLANE_PROFILE:?set DAL_OBSCURA_CONTROL_PLANE_PROFILE}
      DAL_OBSCURA_CONTROL_PLANE_CATALOG_EGRESS_ALLOWLIST: ${DAL_OBSCURA_CONTROL_PLANE_CATALOG_EGRESS_ALLOWLIST:?set DAL_OBSCURA_CONTROL_PLANE_CATALOG_EGRESS_ALLOWLIST}
      DAL_OBSCURA_CONTROL_PLANE_HOST: ${DAL_OBSCURA_CONTROL_PLANE_HOST:-0.0.0.0}
      DAL_OBSCURA_CONTROL_PLANE_PORT: ${DAL_OBSCURA_CONTROL_PLANE_PORT:-8820}
      DAL_OBSCURA_CONTROL_PLANE_ADMIN_TOKEN: ${DAL_OBSCURA_CONTROL_PLANE_ADMIN_TOKEN:?set DAL_OBSCURA_CONTROL_PLANE_ADMIN_TOKEN}
      DAL_OBSCURA_CONTROL_PLANE_REVIEW_SECRET: ${DAL_OBSCURA_CONTROL_PLANE_REVIEW_SECRET:?set DAL_OBSCURA_CONTROL_PLANE_REVIEW_SECRET}
      DAL_OBSCURA_CONTROL_PLANE_BOOTSTRAP_ENABLED: ${DAL_OBSCURA_CONTROL_PLANE_BOOTSTRAP_ENABLED:-false}
      DAL_OBSCURA_CONTROL_PLANE_MAX_REQUEST_BYTES: ${DAL_OBSCURA_CONTROL_PLANE_MAX_REQUEST_BYTES:-1048576}
      DAL_OBSCURA_CONTROL_PLANE_LOGIN_RATE_LIMIT_ATTEMPTS: ${DAL_OBSCURA_CONTROL_PLANE_LOGIN_RATE_LIMIT_ATTEMPTS:-20}
      DAL_OBSCURA_CONTROL_PLANE_LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${DAL_OBSCURA_CONTROL_PLANE_LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      DAL_OBSCURA_CONTROL_PLANE_LOGIN_RATE_LIMIT_BLOCK_SECONDS: ${DAL_OBSCURA_CONTROL_PLANE_LOGIN_RATE_LIMIT_BLOCK_SECONDS:-300}
      DAL_OBSCURA_CONTROL_PLANE_CORS_ORIGINS: ${DAL_OBSCURA_CONTROL_PLANE_CORS_ORIGINS:?set DAL_OBSCURA_CONTROL_PLANE_CORS_ORIGINS}
      DAL_OBSCURA_CONTROL_PLANE_OIDC_ISSUER: ${DAL_OBSCURA_CONTROL_PLANE_OIDC_ISSUER:?set DAL_OBSCURA_CONTROL_PLANE_OIDC_ISSUER}
      DAL_OBSCURA_CONTROL_PLANE_OIDC_AUDIENCE: ${DAL_OBSCURA_CONTROL_PLANE_OIDC_AUDIENCE:?set DAL_OBSCURA_CONTROL_PLANE_OIDC_AUDIENCE}
      DAL_OBSCURA_CONTROL_PLANE_OIDC_JWKS_URL: ${DAL_OBSCURA_CONTROL_PLANE_OIDC_JWKS_URL:-}
      DAL_OBSCURA_CONTROL_PLANE_OIDC_ADMIN_GROUP: ${DAL_OBSCURA_CONTROL_PLANE_OIDC_ADMIN_GROUP:?set DAL_OBSCURA_CONTROL_PLANE_OIDC_ADMIN_GROUP}
      DAL_OBSCURA_CONTROL_PLANE_UI_OIDC_ISSUER: ${DAL_OBSCURA_CONTROL_PLANE_UI_OIDC_ISSUER:?set DAL_OBSCURA_CONTROL_PLANE_UI_OIDC_ISSUER}
      DAL_OBSCURA_CONTROL_PLANE_UI_OIDC_CLIENT_ID: ${DAL_OBSCURA_CONTROL_PLANE_UI_OIDC_CLIENT_ID:?set DAL_OBSCURA_CONTROL_PLANE_UI_OIDC_CLIENT_ID}
      DAL_OBSCURA_CONTROL_PLANE_UI_OIDC_REDIRECT_URI: ${DAL_OBSCURA_CONTROL_PLANE_UI_OIDC_REDIRECT_URI:?set DAL_OBSCURA_CONTROL_PLANE_UI_OIDC_REDIRECT_URI}
      DAL_OBSCURA_CONTROL_PLANE_UI_OIDC_POST_LOGOUT_REDIRECT_URI: ${DAL_OBSCURA_CONTROL_PLANE_UI_OIDC_POST_LOGOUT_REDIRECT_URI:?set DAL_OBSCURA_CONTROL_PLANE_UI_OIDC_POST_LOGOUT_REDIRECT_URI}
      DAL_OBSCURA_CONTROL_PLANE_UI_OIDC_SCOPE: ${DAL_OBSCURA_CONTROL_PLANE_UI_OIDC_SCOPE:-openid profile email}
      DAL_OBSCURA_CONTROL_PLANE_UI_OIDC_JWKS_URL: ${DAL_OBSCURA_CONTROL_PLANE_UI_OIDC_JWKS_URL:-}
    command: ["control-plane"]
    expose:
      - "8820"
    networks:
      - backend
      - egress
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8820/readyz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"

  data-plane:
    image: ${DAL_OBSCURA_IMAGE:?set DAL_OBSCURA_IMAGE}
    environment:
      DAL_OBSCURA_DATABASE_URL: ${DAL_OBSCURA_DATA_PLANE_DATABASE_URL:?set DAL_OBSCURA_DATA_PLANE_DATABASE_URL}
      DAL_OBSCURA_TICKET_SECRET: ${DAL_OBSCURA_TICKET_SECRET:?set DAL_OBSCURA_TICKET_SECRET}
      DAL_OBSCURA_DATA_PLANE_PROFILE: ${DAL_OBSCURA_DATA_PLANE_PROFILE:?set DAL_OBSCURA_DATA_PLANE_PROFILE}
      DAL_OBSCURA_CELL_ID: ${DAL_OBSCURA_CELL_ID:?set DAL_OBSCURA_CELL_ID}
      DAL_OBSCURA_LOCATION: ${DAL_OBSCURA_LOCATION:?set DAL_OBSCURA_LOCATION}
      DAL_OBSCURA_DATA_PLANE_HEALTH_HOST: ${DAL_OBSCURA_DATA_PLANE_HEALTH_HOST:-0.0.0.0}
      DAL_OBSCURA_DATA_PLANE_HEALTH_PORT: ${DAL_OBSCURA_DATA_PLANE_HEALTH_PORT:-8816}
      DAL_OBSCURA_TLS_CERT: /run/secrets/flight.crt
      DAL_OBSCURA_TLS_KEY: /run/secrets/flight.key
      DAL_OBSCURA_TLS_CLIENT_CA: /run/secrets/client-ca.crt
      DAL_OBSCURA_TLS_VERIFY_CLIENT: ${DAL_OBSCURA_TLS_VERIFY_CLIENT:?set DAL_OBSCURA_TLS_VERIFY_CLIENT}
      DAL_OBSCURA_TICKET_CLEANUP_INTERVAL_SECONDS: ${DAL_OBSCURA_TICKET_CLEANUP_INTERVAL_SECONDS:-60}
      DAL_OBSCURA_SECRET_PROVIDER_MODULE: ${DAL_OBSCURA_SECRET_PROVIDER_MODULE:-dal_obscura.data_plane.infrastructure.adapters.secret_providers.EnvSecretProvider}
      DAL_OBSCURA_SECRET_PROVIDER_CONFIG: ${DAL_OBSCURA_SECRET_PROVIDER_CONFIG:-}
      DAL_OBSCURA_SECRET_PROVIDER_SECRETS: ${DAL_OBSCURA_SECRET_PROVIDER_SECRETS:-}
    secrets:
      - source: flight_cert
        target: flight.crt
      - source: flight_key
        target: flight.key
      - source: client_ca
        target: client-ca.crt
    command: ["data-plane"]
    expose:
      - "8815"
      - "8816"
    networks:
      - backend
      - egress
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8816/readyz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "2G"

  ui:
    image: ${DAL_OBSCURA_UI_IMAGE:?set DAL_OBSCURA_UI_IMAGE}
    depends_on:
      control-plane:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"

networks:
  backend:
    internal: true
  egress: {}

secrets:
  flight_cert:
    file: ${DAL_OBSCURA_TLS_CERT_SOURCE:?set DAL_OBSCURA_TLS_CERT_SOURCE}
  flight_key:
    file: ${DAL_OBSCURA_TLS_KEY_SOURCE:?set DAL_OBSCURA_TLS_KEY_SOURCE}
  client_ca:
    file: ${DAL_OBSCURA_TLS_CLIENT_CA_SOURCE:?set DAL_OBSCURA_TLS_CLIENT_CA_SOURCE}

volumes:
  postgres-data:
