repos:
-   repo: local
    hooks:
    - id: ruff-format
      name: Ruff format
      entry: uv run ruff format
      language: system
      types: [python]
      exclude: ^src/dal_obscura/flight/v1/.*_pb2\.py$
      args: ["--"]
    - id: ruff-check
      name: Ruff lint
      entry: uv run ruff check
      language: system
      types: [python]
      args: ["--"]
    - id: ty
      name: Ty type check
      entry: uv run ty check
      language: system
      pass_filenames: false
      files: ^(src|packages)/.*\.py$
    - id: pytest
      name: Pytest non-heavy
      entry: uv run pytest
      language: system
      pass_filenames: false
      files: ^(src|packages|tests)/.*\.py$
      args: ["-m", "not heavy and not integration and not socket", "--maxfail=1", "--disable-warnings"]
