# The demo launcher sequences finite jobs explicitly and checks their exit status.
# Only these five services stay running; jobs are in the tools profile.
x-service: &service
  image: ${PROJECT_NAME:?run ./demo init}-service:local
  environment: &database
    DAL_OBSCURA_DATABASE_URL: postgresql+psycopg://obscura:${APP_DB_PASSWORD}@postgres:5432/obscura
    LOCAL_ICEBERG_URI: postgresql+psycopg://iceberg:${ICEBERG_DB_PASSWORD}@postgres:5432/iceberg
    DAL_OBSCURA_SECRET_PROVIDER_CONFIG: '{"scope_grants":{"catalog:retail_demo":["LOCAL_ICEBERG_URI"]}}'
  volumes:
    - ./scripts:/example/scripts:ro
    - ./fixtures:/example/fixtures:ro

services:
  postgres:
    image: ${POSTGRES_IMAGE:?run ./demo init}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      ICEBERG_DB_PASSWORD: ${ICEBERG_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/10-local-databases.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d postgres']
      interval: 2s
      timeout: 3s
      retries: 45
    restart: unless-stopped

  keycloak:
    image: ${KEYCLOAK_IMAGE:?run ./demo init}
    command: [start-dev, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT}
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx512m
      UI_ORIGIN: http://localhost:${UI_PORT}
      OIDC_CLI_CLIENT_SECRET: ${OIDC_CLI_CLIENT_SECRET}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD}
      ASSET_OWNER_PASSWORD: ${ASSET_OWNER_PASSWORD}
      US_ANALYST_PASSWORD: ${US_ANALYST_PASSWORD}
      EU_ANALYST_PASSWORD: ${EU_ANALYST_PASSWORD}
      DATA_STEWARD_PASSWORD: ${DATA_STEWARD_PASSWORD}
      BLOCKED_USER_PASSWORD: ${BLOCKED_USER_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT}:8080"
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: [CMD-SHELL, "bash -ec '{ printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&0; grep -q \" 200 \"; } 0<>/dev/tcp/127.0.0.1/9000'"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 20s
    restart: unless-stopped

  control-plane:
    <<: *service
    command: [control-plane]
    environment:
      <<: *database
      DAL_OBSCURA_CONTROL_PLANE_HOST: 0.0.0.0
      DAL_OBSCURA_CONTROL_PLANE_PORT: "8820"
      DAL_OBSCURA_CONTROL_PLANE_PROFILE: local
      DAL_OBSCURA_CONTROL_PLANE_ADMIN_TOKEN: ${ADMIN_TOKEN}
      DAL_OBSCURA_CONTROL_PLANE_BOOTSTRAP_ENABLED: "false"
      DAL_OBSCURA_CONTROL_PLANE_CORS_ORIGINS: http://localhost:${UI_PORT}
      DAL_OBSCURA_CONTROL_PLANE_OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT}/realms/dal-obscura-demo
      DAL_OBSCURA_CONTROL_PLANE_OIDC_AUDIENCE: dal-obscura
      DAL_OBSCURA_CONTROL_PLANE_OIDC_JWKS_URL: http://keycloak:8080/realms/dal-obscura-demo/protocol/openid-connect/certs
      DAL_OBSCURA_CONTROL_PLANE_OIDC_SUBJECT_CLAIM: preferred_username
      DAL_OBSCURA_CONTROL_PLANE_OIDC_GROUP_CLAIMS: groups
      DAL_OBSCURA_CONTROL_PLANE_OIDC_ADMIN_GROUP: platform-admins
      DAL_OBSCURA_CONTROL_PLANE_UI_OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT}/realms/dal-obscura-demo
      DAL_OBSCURA_CONTROL_PLANE_UI_OIDC_CLIENT_ID: dal-obscura-ui
      DAL_OBSCURA_CONTROL_PLANE_UI_OIDC_ORIGIN: http://localhost:${UI_PORT}
      DAL_OBSCURA_CONTROL_PLANE_UI_OIDC_REDIRECT_URI: http://localhost:${UI_PORT}/auth/callback
      DAL_OBSCURA_CONTROL_PLANE_UI_OIDC_POST_LOGOUT_REDIRECT_URI: http://localhost:${UI_PORT}
      DAL_OBSCURA_CONTROL_PLANE_UI_OIDC_TOKEN_ENDPOINT: http://keycloak:8080/realms/dal-obscura-demo/protocol/openid-connect/token
      DAL_OBSCURA_CONTROL_PLANE_UI_OIDC_JWKS_URL: http://keycloak:8080/realms/dal-obscura-demo/protocol/openid-connect/certs
      DAL_OBSCURA_CONTROL_PLANE_UI_OIDC_SCOPE: openid profile
    volumes:
      - warehouse:/warehouse:ro
      - ./scripts/healthcheck.py:/example/healthcheck.py:ro
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, /example/healthcheck.py, http://127.0.0.1:8820/readyz]
      interval: 2s
      timeout: 3s
      retries: 45
    restart: unless-stopped

  data-plane:
    <<: *service
    command: [data-plane]
    environment:
      <<: *database
      DAL_OBSCURA_LOCATION: grpc://0.0.0.0:8815
      DAL_OBSCURA_TICKET_SECRET: ${TICKET_SECRET}
      DAL_OBSCURA_DATA_PLANE_HEALTH_HOST: 0.0.0.0
      DAL_OBSCURA_DATA_PLANE_HEALTH_PORT: "8816"
    volumes:
      - warehouse:/warehouse:ro
      - ./scripts/healthcheck.py:/example/healthcheck.py:ro
    ports:
      - "127.0.0.1:${FLIGHT_PORT}:8815"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, /example/healthcheck.py, http://127.0.0.1:8816/readyz]
      interval: 2s
      timeout: 3s
      retries: 45
    restart: unless-stopped

  ui:
    image: ${PROJECT_NAME:?run ./demo init}-ui:local
    ports:
      - "127.0.0.1:${UI_PORT}:8080"
    depends_on:
      control-plane:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/]
      interval: 2s
      timeout: 3s
      retries: 45
    restart: unless-stopped

  migrate:
    <<: *service
    profiles: [tools]
    command: [dal-obscura-migrate, upgrade]

  seed:
    <<: *service
    profiles: [tools]
    user: "0:0"
    command: [python, /example/scripts/seed_table.py]
    environment:
      ICEBERG_CATALOG_URI: postgresql+psycopg://iceberg:${ICEBERG_DB_PASSWORD}@postgres:5432/iceberg
      ICEBERG_WAREHOUSE: /warehouse
    volumes:
      - ./scripts:/example/scripts:ro
      - ./fixtures:/example/fixtures:ro
      - warehouse:/warehouse

  provision:
    <<: *service
    profiles: [tools]
    command: [python, /example/scripts/provision_demo.py]
    environment:
      CONTROL_PLANE_URL: http://control-plane:8820
      OIDC_TOKEN_URL: http://keycloak:8080/realms/dal-obscura-demo/protocol/openid-connect/token
      OIDC_CLI_CLIENT_SECRET: ${OIDC_CLI_CLIENT_SECRET}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD}
      DEMO_OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT}/realms/dal-obscura-demo
      ICEBERG_WAREHOUSE: /warehouse

  check:
    <<: *service
    profiles: [tools]
    command: [python, /example/scripts/check_demo.py]
    environment:
      FLIGHT_URI: grpc+tcp://data-plane:8815
      OIDC_TOKEN_URL: http://keycloak:8080/realms/dal-obscura-demo/protocol/openid-connect/token
      OIDC_CLIENT_ID: dal-obscura-cli
      OIDC_CLI_CLIENT_SECRET: ${OIDC_CLI_CLIENT_SECRET}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD}
      ASSET_OWNER_PASSWORD: ${ASSET_OWNER_PASSWORD}
      US_ANALYST_PASSWORD: ${US_ANALYST_PASSWORD}
      EU_ANALYST_PASSWORD: ${EU_ANALYST_PASSWORD}
      DATA_STEWARD_PASSWORD: ${DATA_STEWARD_PASSWORD}
      BLOCKED_USER_PASSWORD: ${BLOCKED_USER_PASSWORD}

volumes:
  postgres-data:
  warehouse:
