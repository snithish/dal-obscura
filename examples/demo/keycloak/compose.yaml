name: dal-obscura-keycloak-demo

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    env_file:
      - .runtime/keycloak.env
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
      - --hostname-strict=false
      - --health-enabled=true
    ports:
      - "127.0.0.1:20080:8080"
    volumes:
      - ./.runtime/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 2s
      timeout: 3s
      retries: 45
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    env_file:
      - .runtime/postgres.env
    ports:
      - "127.0.0.1:25432:5432"
    volumes:
      - postgres-data-v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: ${DAL_OBSCURA_IMAGE:-ghcr.io/snithish/dal-obscura:latest}
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .runtime/control-plane.env
    command: ["dal-obscura-migrate", "upgrade"]

  setup:
    build:
      context: ../../..
      dockerfile: examples/demo/keycloak/Dockerfile.helper
      args:
        DAL_OBSCURA_IMAGE: ${DAL_OBSCURA_IMAGE:-ghcr.io/snithish/dal-obscura:latest}
    env_file:
      - .runtime/setup.env
    depends_on:
      control-plane:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    volumes:
      - .:/workspace/demo:rw
    command:
      - sh
      - -ec
      - rm -f /workspace/demo/.runtime/setup.done; python /workspace/demo/scripts/seed_table.py && python /workspace/demo/scripts/provision_demo.py && touch /workspace/demo/.runtime/setup.done && exec tail -f /dev/null
    healthcheck:
      test: ["CMD", "test", "-f", "/workspace/demo/.runtime/setup.done"]
      interval: 1s
      timeout: 3s
      retries: 60

  control-plane:
    image: ${DAL_OBSCURA_IMAGE:-ghcr.io/snithish/dal-obscura:latest}
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .runtime/control-plane.env
    ports:
      - "127.0.0.1:28820:8820"
    volumes:
      - .:/workspace/demo:rw
    command: ["control-plane"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; raise SystemExit(urlopen('http://127.0.0.1:8820/readyz', timeout=2).status != 200)\""]
      interval: 2s
      timeout: 3s
      retries: 30

  control-plane-ui:
    build:
      context: ../../..
      dockerfile: ui/Dockerfile
    depends_on:
      control-plane:
        condition: service_healthy
        restart: true
    env_file:
      - .runtime/ui.env
    ports:
      - "127.0.0.1:${DAL_OBSCURA_DEMO_UI_PORT:-28821}:8080"

  dal-obscura:
    image: ${DAL_OBSCURA_IMAGE:-ghcr.io/snithish/dal-obscura:latest}
    depends_on:
      setup:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:28115:8815"
    volumes:
      - .:/workspace/demo:rw
    command:
      - sh
      - -c
      - set -a && . /workspace/demo/.runtime/data-plane.env && set +a && exec dal-obscura-entrypoint data-plane
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; raise SystemExit(urlopen('http://127.0.0.1:8816/readyz', timeout=2).status != 200)\""]
      interval: 2s
      timeout: 3s
      retries: 45

  client:
    build:
      context: ../../..
      dockerfile: examples/demo/keycloak/Dockerfile.helper
      args:
        DAL_OBSCURA_IMAGE: ${DAL_OBSCURA_IMAGE:-ghcr.io/snithish/dal-obscura:latest}
    depends_on:
      dal-obscura:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    env_file:
      - .runtime/client.env
    volumes:
      - .:/workspace/demo:rw
    command: ["tail", "-f", "/dev/null"]

volumes:
  # Schema baseline changed during pre-release development. Keep old local state intact.
  postgres-data-v2:
