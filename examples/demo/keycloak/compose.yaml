name: dal-obscura-keycloak-demo

services:
  caddy:
    image: caddy:2-alpine
    depends_on:
      keycloak:
        condition: service_healthy
      control-plane-ui:
        condition: service_started
      control-plane:
        condition: service_healthy
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q --spider https://governance.localhost/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    env_file:
      - .runtime/keycloak.env
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
      - --http-enabled=true
      - --proxy-headers=xforwarded
      - --health-enabled=true
    volumes:
      - ./.runtime/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 2s
      timeout: 3s
      retries: 45
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    env_file:
      - .runtime/postgres.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: ${DAL_OBSCURA_IMAGE:-ghcr.io/snithish/dal-obscura:latest}
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .runtime/control-plane.env
    command: ["dal-obscura-migrate", "upgrade"]

  setup:
    build:
      context: ../../..
      dockerfile: examples/demo/keycloak/Dockerfile.helper
      args:
        DAL_OBSCURA_IMAGE: ${DAL_OBSCURA_IMAGE:-ghcr.io/snithish/dal-obscura:latest}
    env_file:
      - .runtime/setup.env
    depends_on:
      control-plane:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    volumes:
      - .:/workspace/demo:rw
    command:
      - sh
      - -c
      - python /workspace/demo/scripts/seed_table.py && python /workspace/demo/scripts/provision_demo.py && touch /workspace/demo/.runtime/setup.done && tail -f /dev/null
    healthcheck:
      test: ["CMD", "test", "-f", "/workspace/demo/.runtime/setup.done"]
      interval: 1s
      timeout: 3s
      retries: 60

  control-plane:
    image: ${DAL_OBSCURA_IMAGE:-ghcr.io/snithish/dal-obscura:latest}
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .runtime/control-plane.env
    volumes:
      - .:/workspace/demo:rw
    command: ["control-plane"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; raise SystemExit(urlopen('http://127.0.0.1:8820/readyz', timeout=2).status != 200)\""]
      interval: 2s
      timeout: 3s
      retries: 30

  control-plane-ui:
    build:
      context: ../../..
      dockerfile: ui/Dockerfile
    depends_on:
      control-plane:
        condition: service_healthy
        restart: true
    env_file:
      - .runtime/ui.env

  dal-obscura:
    image: ${DAL_OBSCURA_IMAGE:-ghcr.io/snithish/dal-obscura:latest}
    depends_on:
      setup:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8815:8815"
    volumes:
      - .:/workspace/demo:rw
    command:
      - sh
      - -c
      - set -a && . /workspace/demo/.runtime/data-plane.env && set +a && exec dal-obscura-entrypoint data-plane
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; raise SystemExit(urlopen('http://127.0.0.1:8816/readyz', timeout=2).status != 200)\""]
      interval: 2s
      timeout: 3s
      retries: 45

  client:
    build:
      context: ../../..
      dockerfile: examples/demo/keycloak/Dockerfile.helper
      args:
        DAL_OBSCURA_IMAGE: ${DAL_OBSCURA_IMAGE:-ghcr.io/snithish/dal-obscura:latest}
    depends_on:
      dal-obscura:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    env_file:
      - .runtime/client.env
    volumes:
      - .:/workspace/demo:rw
    command: ["tail", "-f", "/dev/null"]

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
