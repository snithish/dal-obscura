[project]
name = "dal-obscura"
version = "0.3.0"
description = "Data access layer with masking, row filters, and Arrow Flight"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
authors = [{ name = "dal-obscura" }]

dependencies = [
  "dal-obscura-plugin-api==0.3.0",
  "pyarrow>=15.0.0",
  "protobuf>=7.35.1",
]

[project.optional-dependencies]
duckdb = ["duckdb>=1.0.0"]
polars = ["polars>=1.0.0"]
postgres = ["psycopg[binary]>=3.2.0"]
cloud = ["pyiceberg[glue,hive,dynamodb,bigquery,gcsfs,adlfs,s3fs,hf]==0.11.1"]
server = [
  "packaging>=24.0",
  "duckdb==1.5.4",
  "psutil>=5.9.0",
  "pyiceberg[sql-sqlite]==0.11.1",
  "dal-obscura-iceberg==0.3.0",
  "dal-obscura-secrets==0.3.0",
  "httpx>=0.27.0",
  "pydantic>=2.12.0",
  "pyjwt>=2.8.0",
  "sqlglot>=30.2.1",
  "cryptography>=46.0.7",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "grpcio>=1.62.0",
]
examples = ["dal-obscura[duckdb,polars]"]

test = [
  "pytest>=8.0.0",
  "pytest-benchmark>=4.0.0",
  "pytest-cov>=4.1.0",
  "httpx>=0.27.0",
]

[project.scripts]
dal-obscura = "dal_obscura.interfaces.cli.operator:main"
dal-obscura-control-plane = "dal_obscura.interfaces.cli.control:main"
dal-obscura-migrate = "dal_obscura.adapters.sql.database.cli:main"
dal-obscura-maintenance = "dal_obscura.interfaces.cli.maintenance:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["packages/*/src/**", "packages/*/pyproject.toml", "packages/iceberg-reader/**"]
source-exclude = ["packages/iceberg-reader/target/**", "**/__pycache__/**"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
dal-obscura-secrets = { workspace = true }
dal-obscura-iceberg = { workspace = true }
dal-obscura-plugin-conformance = { workspace = true }
dal-obscura-manifest-parquet = { workspace = true }
dal-obscura-iceberg-rest = { workspace = true }
dal-obscura-delta = { workspace = true }
dal-obscura-plugin-api = { workspace = true }
dal-obscura-iceberg-reader = { workspace = true }

[tool.pytest.ini_options]
addopts = "-q --benchmark-skip"
filterwarnings = ["error"]
testpaths = ["tests"]
markers = [
  "heavy: tests that are intentionally excluded from the default pre-commit pytest hook",
  "integration: tests that require external services such as PostgreSQL",
  "socket: tests that bind local sockets and require network permissions",
]

[dependency-groups]
dev = [
  "dal-obscura-plugin-conformance[native]==0.3.0",
  "dal-obscura-manifest-parquet==0.3.0",
  "dal-obscura-iceberg-rest==0.3.0",
  "dal-obscura-delta==0.3.0",
  "pre-commit>=3.4.0",
  "pytest>=8.0.0",
  "pytest-benchmark>=4.0.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.4.8",
  "httpx>=0.27.0",
  "sqlalchemy>=2.0.0",
  "ty>=0.0.22",
  "polars>=1.0.0",
  "deltalake[pyarrow]==1.5.0",
  "moto[s3]==5.1.14",
  "flask>=3.1,<4",
  "flask-cors>=6,<7",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["src/dal_obscura/flight/v1/*_pb2.py", "src/dal_obscura/flight/v1/*_pb2.pyi"]

[tool.ruff.lint]
select = [
  "C90",  # mccabe complexity
  "B",  # flake8-bugbear
  "C4",  # flake8-comprehensions
  "E",  # pycodestyle errors
  "F",  # Pyflakes
  "I",  # isort
  "PIE",  # flake8-pie
  "PGH",  # pygrep-hooks
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # Ruff-specific rules
  "SIM",  # flake8-simplify
  "TID252",  # flake8-tidy-imports: ban relative imports
  "UP",  # pyupgrade
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"src/**/**/*_pb2.py" = ["E501", "I001", "UP009"]
"src/**/**/*_pb2.pyi" = ["ALL"]  # generated protobuf stubs

[tool.ruff.format]
line-ending = "lf"
