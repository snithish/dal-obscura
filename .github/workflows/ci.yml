name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  python-quality:
    name: Python quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --dev --extra server --extra postgres --frozen

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: >-
          uv run ty check
          --extra-search-path packages/plugin-api/src
          --extra-search-path packages/plugin-conformance/src
          --extra-search-path packages/manifest-parquet-plugin/src
          --extra-search-path packages/iceberg-rest-plugin/src

  python-contract-tests:
    name: Python contract and security tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --dev --extra server --extra postgres --frozen

      - name: Run deterministic contracts
        run: >-
          uv run pytest tests/common tests/domain tests/application tests/connectors
          tests/architecture -q

  python-integration-tests:
    name: Python integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --dev --extra server --extra postgres --frozen

      - name: Run integration suite
        run: >-
          uv run pytest tests/interfaces tests/infrastructure tests/control_plane
          tests/examples tests/test_e2e_smoke.py -q

  python-package:
    name: Python package smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build package
        run: uv build

      - name: Install and import default client wheel
        run: |
          client_env="$(mktemp -d)"
          uv venv "$client_env"
          wheel_path="$(ls dist/dal_obscura-*-py3-none-any.whl)"
          uv pip install --python "$client_env/bin/python" "$wheel_path"
          "$client_env/bin/python" -c 'from dal_obscura.connectors import DalObscuraClient; print(DalObscuraClient.__name__)'

      - name: Install server wheel with Postgres and verify commands
        run: |
          smoke_env="$(mktemp -d)"
          uv venv "$smoke_env"
          wheel_path="$(ls dist/dal_obscura-*-py3-none-any.whl)"
          uv pip install --python "$smoke_env/bin/python" "${wheel_path}[server,postgres]"
          PATH="$smoke_env/bin:$PATH"
          dal-obscura-control-plane --help
          dal-obscura-migrate upgrade --database-url sqlite+pysqlite:///"$smoke_env/config-store.db"
          dal-obscura-migrate check --database-url sqlite+pysqlite:///"$smoke_env/config-store.db"

  python-plugin-contract:
    name: Plugin contract wheel smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build plugin API wheel
        run: |
          mkdir -p "$RUNNER_TEMP/plugin-api-dist"
          uv build --wheel --out-dir "$RUNNER_TEMP/plugin-api-dist" packages/plugin-api

      - name: Build conformance wheel
        run: |
          mkdir -p "$RUNNER_TEMP/plugin-conformance-dist"
          uv build --wheel --out-dir "$RUNNER_TEMP/plugin-conformance-dist" packages/plugin-conformance

      - name: Build independent catalog and format wheels
        run: |
          mkdir -p "$RUNNER_TEMP/independent-plugin-dist"
          uv build --wheel --out-dir "$RUNNER_TEMP/independent-plugin-dist" packages/manifest-parquet-plugin
          uv build --wheel --out-dir "$RUNNER_TEMP/independent-plugin-dist" packages/iceberg-rest-plugin

      - name: Install exact wheels and run conformance tests
        run: |
          uv venv "$RUNNER_TEMP/plugin-env"
          uv pip install --python "$RUNNER_TEMP/plugin-env/bin/python" pytest \
            "$RUNNER_TEMP/plugin-api-dist"/*.whl \
            "$RUNNER_TEMP/plugin-conformance-dist"/*.whl \
            "$RUNNER_TEMP/independent-plugin-dist"/*.whl
          "$RUNNER_TEMP/plugin-env/bin/python" -m pytest packages/plugin-conformance/tests -q
          "$RUNNER_TEMP/plugin-env/bin/python" -m pytest packages/manifest-parquet-plugin/tests packages/iceberg-rest-plugin/tests -q

  python-plugin-integration:
    name: Installed plugin routing
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build exact server and plugin wheels
        run: |
          mkdir -p "$RUNNER_TEMP/integration-dist"
          uv build --wheel --out-dir "$RUNNER_TEMP/integration-dist" .
          uv build --wheel --out-dir "$RUNNER_TEMP/integration-dist" packages/plugin-api
          uv build --wheel --out-dir "$RUNNER_TEMP/integration-dist" packages/plugin-conformance
          uv build --wheel --out-dir "$RUNNER_TEMP/integration-dist" packages/manifest-parquet-plugin
          uv build --wheel --out-dir "$RUNNER_TEMP/integration-dist" packages/iceberg-rest-plugin

      - name: Install exact wheels and exercise core routing
        run: |
          uv venv "$RUNNER_TEMP/integration-env"
          server_wheel="$(ls "$RUNNER_TEMP/integration-dist"/dal_obscura-*.whl)"
          uv pip install --python "$RUNNER_TEMP/integration-env/bin/python" pytest \
            "${server_wheel}[server]" \
            "$RUNNER_TEMP/integration-dist"/dal_obscura_plugin_api-*.whl \
            "$RUNNER_TEMP/integration-dist"/dal_obscura_manifest_parquet-*.whl \
            "$RUNNER_TEMP/integration-dist"/dal_obscura_iceberg_rest-*.whl
          PYTHONPATH= "$RUNNER_TEMP/integration-env/bin/python" -m pytest \
            tests/plugin_platform/test_public_plugin_adapter.py \
            tests/plugin_platform/test_builtin_plugins.py -q

  python-native-iceberg:
    name: Native Iceberg conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install native scan dependencies
        run: uv sync --dev --extra server --frozen

      - name: Run pinned-snapshot and schema conformance tests
        run: uv run pytest tests/infrastructure/adapters/test_iceberg_phase0_regressions.py -q

  jvm:
    name: JVM connector tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify JVM workspace
        run: mvn -f connectors/jvm/pom.xml verify

  governance-ui:
    name: Governance UI build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/governance-ui/pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable

      - name: Install UI dependencies
        run: pnpm --dir apps/governance-ui install --frozen-lockfile

      - name: Type-check and build UI
        run: |
          pnpm --dir apps/governance-ui test
          pnpm --dir apps/governance-ui build

  container:
    name: Build, scan, and publish image
    runs-on: ubuntu-24.04
    needs:
      - python-quality
      - python-contract-tests
      - python-integration-tests
      - python-package
      - python-plugin-contract
      - python-plugin-integration
      - python-native-iceberg
      - jvm
      - governance-ui
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=dal-obscura
            org.opencontainers.image.description=Policy-aware Arrow Flight data access layer
          annotations: |
            org.opencontainers.image.description=Policy-aware Arrow Flight data access layer

      - name: Log in to GHCR for immutable candidate publication
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build one immutable image candidate
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          tags: |
            ${{ github.event_name == 'pull_request' && 'dal-obscura:ci' || format('{0}/{1}:candidate-{2}', env.REGISTRY, env.IMAGE_NAME, github.sha) }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Scan exact candidate digest
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ github.event_name == 'pull_request' && 'dal-obscura:ci' || format('{0}/{1}@{2}', env.REGISTRY, env.IMAGE_NAME, steps.image.outputs.digest) }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Promote the scanned immutable digest
        if: github.event_name != 'pull_request'
        env:
          PROMOTION_TAGS: ${{ steps.meta.outputs.tags }}
          CANDIDATE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -eu
          candidate="${REGISTRY}/${IMAGE_NAME}@${CANDIDATE_DIGEST}"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create --tag "$tag" "$candidate"
          done <<EOF
          ${PROMOTION_TAGS}
          EOF
