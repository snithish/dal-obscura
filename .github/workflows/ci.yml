name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  python-quality:
    name: Python quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --dev --extra server --extra postgres --frozen

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: >-
          uv run ty check
          --extra-search-path packages/plugin-api/src
          --extra-search-path packages/plugin-conformance/src
          --extra-search-path packages/manifest-parquet-plugin/src
          --extra-search-path packages/iceberg-rest-plugin/src

  python-contract-tests:
    name: Python contract and security tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --dev --extra server --extra postgres --frozen

      - name: Render deployment profiles
        run: |
          docker compose --env-file deployment/production/.env.example \
            -f deployment/production/compose.yaml config --quiet
          uv run --no-project --python 3.12 - <<'PY'
          from runpy import run_path
          demo = run_path("deployment/local-secure/scripts/demo.py")
          root = demo["ROOT"]
          values = demo["initialize"](root, {})
          demo["ensure_tls"](root)
          demo["compose"](values, "config", "--quiet")
          PY


      - name: Run deterministic contracts
        run: >-
          uv run pytest tests/common tests/domain tests/application tests/connectors
          tests/architecture tests/plugin_platform/test_registry.py -q

  secure-local-smoke:
    name: Secure local HTTPS and mTLS demo
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install browser check dependencies
        run: |
          corepack enable
          pnpm --dir apps/governance-ui install --frozen-lockfile
          pnpm --dir apps/governance-ui exec playwright install --with-deps chromium

      - name: Initialize secure demo and verify real authentication
        working-directory: deployment/local-secure
        run: |
          ./demo init
          ./demo check

      - name: Verify preserved restart
        working-directory: deployment/local-secure
        run: |
          ./demo down
          ./demo up
          ./demo check --reads-only

      - name: Show redacted failure diagnostics
        if: failure()
        working-directory: deployment/local-secure
        run: ./demo logs

      - name: Remove disposable demo state
        if: always()
        working-directory: deployment/local-secure
        run: ./demo reset

  python-integration-tests:
    name: Python integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --dev --extra server --extra postgres --frozen

      - name: Run integration suite
        run: >-
          uv run python scripts/require_no_skips.py
          --junitxml "$RUNNER_TEMP/integration.xml" --
          uv run pytest tests/interfaces tests/infrastructure tests/control_plane
          tests/examples tests/test_e2e_smoke.py -q

      - name: Run Python and DuckDB consumer qualification
        env:
          DAL_OBSCURA_RUN_CONSUMER_TESTS: "1"
        run: >-
          uv run python scripts/require_no_skips.py
          --junitxml "$RUNNER_TEMP/consumers.xml" --
          uv run pytest tests/consumers/test_governed_reads.py -q

  postgres-race-tests:
    name: PostgreSQL concurrency gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: dal_obscura
          POSTGRES_PASSWORD: dal_obscura_test_password
          POSTGRES_DB: dal_obscura
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dal_obscura -d dal_obscura"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install PostgreSQL test dependencies
        run: uv sync --dev --extra server --extra postgres --frozen

      - name: Run PostgreSQL barrier race tests
        env:
          DAL_OBSCURA_POSTGRES_TEST_URL: postgresql+psycopg://dal_obscura:dal_obscura_test_password@127.0.0.1:5432/dal_obscura
        run: >-
          uv run python scripts/require_no_skips.py
          --junitxml "$RUNNER_TEMP/postgres.xml" --
          uv run pytest tests/integration/test_live_snapshot.py
          tests/integration/test_recovery_upgrade.py
          tests/common/config_store/test_schema_migrations.py -q

  python-package:
    name: Python package smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build package
        run: |
          uv build
          uv build --wheel --out-dir dist packages/plugin-api

      - name: Install and import default client wheel
        run: |
          client_env="$(mktemp -d)"
          uv venv "$client_env"
          wheel_path="$(ls dist/dal_obscura-*-py3-none-any.whl)"
          uv pip install --python "$client_env/bin/python" "$wheel_path" dist/dal_obscura_plugin_api-*.whl
          "$client_env/bin/python" -c 'from dal_obscura.connectors import DalObscuraClient; print(DalObscuraClient.__name__)'

      - name: Install server wheel with Postgres and verify commands
        run: |
          smoke_env="$(mktemp -d)"
          uv venv "$smoke_env"
          wheel_path="$(ls dist/dal_obscura-*-py3-none-any.whl)"
          uv pip install --python "$smoke_env/bin/python" "${wheel_path}[server,postgres]" dist/dal_obscura_plugin_api-*.whl
          PATH="$smoke_env/bin:$PATH"
          dal-obscura-control-plane --help
          dal-obscura-migrate upgrade --database-url sqlite+pysqlite:///"$smoke_env/config-store.db"
          dal-obscura-migrate check --database-url sqlite+pysqlite:///"$smoke_env/config-store.db"

  python-plugin-contract:
    name: Plugin contract wheel smoke
    runs-on: ubuntu-24.04
    outputs:
      plugin_lock_sha256: ${{ steps.lock.outputs.sha256 }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build plugin API wheel
        run: |
          mkdir -p "$RUNNER_TEMP/plugin-api-dist"
          uv build --wheel --out-dir "$RUNNER_TEMP/plugin-api-dist" packages/plugin-api

      - name: Build conformance wheel
        run: |
          mkdir -p "$RUNNER_TEMP/plugin-conformance-dist"
          uv build --wheel --out-dir "$RUNNER_TEMP/plugin-conformance-dist" packages/plugin-conformance

      - name: Build independent catalog and format wheels
        run: |
          mkdir -p "$RUNNER_TEMP/independent-plugin-dist"
          uv build --wheel --out-dir "$RUNNER_TEMP/independent-plugin-dist" packages/manifest-parquet-plugin
          uv build --wheel --out-dir "$RUNNER_TEMP/independent-plugin-dist" packages/iceberg-rest-plugin

      - name: Install exact wheels and run conformance tests
        run: |
          uv venv "$RUNNER_TEMP/plugin-env"
          uv pip install --python "$RUNNER_TEMP/plugin-env/bin/python" pytest \
            "$RUNNER_TEMP/plugin-api-dist"/*.whl \
            "$RUNNER_TEMP/plugin-conformance-dist"/*.whl \
            "$RUNNER_TEMP/independent-plugin-dist"/*.whl
          "$RUNNER_TEMP/plugin-env/bin/python" -m pytest -o pythonpath= packages/plugin-conformance/tests -q
          "$RUNNER_TEMP/plugin-env/bin/python" -m pytest -o pythonpath= packages/manifest-parquet-plugin/tests packages/iceberg-rest-plugin/tests -q

      - name: Generate and validate lock from installed plugin wheels
        id: lock
        run: |
          PYTHONPATH=src "$RUNNER_TEMP/plugin-env/bin/python" scripts/build_plugin_lock.py \
            --output "$RUNNER_TEMP/plugin-lock.json" \
            --plugin catalog:iceberg.rest \
            --plugin catalog:manifest \
            --plugin table_format:parquet.dataset
          PYTHONPATH=src "$RUNNER_TEMP/plugin-env/bin/python" -c \
            'from dal_obscura.sources.plugins import load_plugin_lock_file; assert len(load_plugin_lock_file("'$RUNNER_TEMP'/plugin-lock.json")) == 3'
          echo "sha256=$(sha256sum \"$RUNNER_TEMP/plugin-lock.json\" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

  python-plugin-integration:
    name: Installed plugin routing
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build exact server and plugin wheels
        run: |
          mkdir -p "$RUNNER_TEMP/integration-dist"
          uv build --wheel --out-dir "$RUNNER_TEMP/integration-dist" .
          uv build --wheel --out-dir "$RUNNER_TEMP/integration-dist" packages/plugin-api
          uv build --wheel --out-dir "$RUNNER_TEMP/integration-dist" packages/plugin-conformance
          uv build --wheel --out-dir "$RUNNER_TEMP/integration-dist" packages/manifest-parquet-plugin
          uv build --wheel --out-dir "$RUNNER_TEMP/integration-dist" packages/iceberg-rest-plugin

      - name: Install exact wheels and exercise core routing
        run: |
          uv venv "$RUNNER_TEMP/integration-env"
          server_wheel="$(ls "$RUNNER_TEMP/integration-dist"/dal_obscura-*.whl)"
          uv pip install --python "$RUNNER_TEMP/integration-env/bin/python" pytest \
            "${server_wheel}[server]" \
            "$RUNNER_TEMP/integration-dist"/dal_obscura_plugin_api-*.whl \
            "$RUNNER_TEMP/integration-dist"/dal_obscura_manifest_parquet-*.whl \
            "$RUNNER_TEMP/integration-dist"/dal_obscura_iceberg_rest-*.whl
          PYTHONPATH= "$RUNNER_TEMP/integration-env/bin/python" -m pytest -o pythonpath= \
            tests/plugin_platform/test_public_catalog_adapter.py \
            tests/plugin_platform/test_public_format_adapter.py \
            tests/plugin_platform/test_iceberg_format_plugin.py -q

  python-native-iceberg:
    name: Native Iceberg conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install native scan dependencies
        run: uv sync --dev --extra server --frozen

      - name: Run pinned-snapshot and schema conformance tests
        run: uv run pytest tests/infrastructure/adapters/test_iceberg_phase0_regressions.py -q

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/governance-ui/pnpm-lock.yaml

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Export locked production Python requirements
        run: >-
          uv export --frozen --no-dev --extra server --extra postgres
          --format requirements.txt
          --output-file "$RUNNER_TEMP/requirements.txt"

      - name: Audit locked Python dependencies
        run: >-
          uvx --from pip-audit pip-audit
          --strict
          --requirement "$RUNNER_TEMP/requirements.txt"

      - name: Enable pnpm
        run: corepack enable

      - name: Audit locked UI dependencies
        run: pnpm --dir apps/governance-ui audit --prod --audit-level high

  jvm:
    name: JVM connector tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify JVM workspace
        run: mvn -f connectors/jvm/pom.xml verify

  governance-ui:
    name: Governance UI build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/governance-ui/pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable

      - name: Install UI dependencies
        run: pnpm --dir apps/governance-ui install --frozen-lockfile

      - name: Type-check and build UI
        run: |
          pnpm --dir apps/governance-ui check
          pnpm --dir apps/governance-ui test
          pnpm --dir apps/governance-ui check:api-types
          pnpm --dir apps/governance-ui build

      - name: Install Playwright browser
        run: pnpm --dir apps/governance-ui exec playwright install --with-deps chromium

      - name: Build and test the designbook
        run: |
          pnpm --dir apps/governance-ui build-storybook
          pnpm --dir apps/governance-ui test:stories

      - name: Run built-shell browser checks
        run: pnpm --dir apps/governance-ui test:e2e

  ui-image:
    name: Build, scan, and publish UI image
    runs-on: ubuntu-24.04
    needs:
      - governance-ui
    outputs:
      ui_digest: ${{ steps.image.outputs.digest }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate UI image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-ui
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Log in to GHCR for immutable UI candidate publication
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build one immutable UI image candidate
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ui/Dockerfile
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          tags: |
            ${{ github.event_name == 'pull_request' && 'dal-obscura-ui:ci' || format('{0}/{1}-ui:candidate-{2}', env.REGISTRY, env.IMAGE_NAME, github.sha) }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Scan exact UI candidate digest
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ github.event_name == 'pull_request' && 'dal-obscura-ui:ci' || format('{0}/{1}-ui@{2}', env.REGISTRY, env.IMAGE_NAME, steps.image.outputs.digest) }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Promote the scanned immutable UI digest
        if: github.event_name != 'pull_request'
        env:
          PROMOTION_TAGS: ${{ steps.meta.outputs.tags }}
          CANDIDATE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -eu
          candidate="${REGISTRY}/${IMAGE_NAME}-ui@${CANDIDATE_DIGEST}"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create --tag "$tag" "$candidate"
          done <<EOF
          ${PROMOTION_TAGS}
          EOF

  container:
    name: Build, scan, and publish image
    runs-on: ubuntu-24.04
    needs:
      - python-quality
      - python-contract-tests
      - python-integration-tests
      - postgres-race-tests
      - python-package
      - python-plugin-contract
      - python-plugin-integration
      - python-native-iceberg
      - dependency-audit
      - jvm
      - governance-ui
      - ui-image
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=dal-obscura
            org.opencontainers.image.description=Policy-aware Arrow Flight data access layer
          annotations: |
            org.opencontainers.image.description=Policy-aware Arrow Flight data access layer

      - name: Log in to GHCR for immutable candidate publication
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build one immutable image candidate
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          tags: |
            ${{ github.event_name == 'pull_request' && 'dal-obscura:ci' || format('{0}/{1}:candidate-{2}', env.REGISTRY, env.IMAGE_NAME, github.sha) }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Scan exact candidate digest
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ github.event_name == 'pull_request' && 'dal-obscura:ci' || format('{0}/{1}@{2}', env.REGISTRY, env.IMAGE_NAME, steps.image.outputs.digest) }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Promote the scanned immutable digest
        if: github.event_name != 'pull_request'
        env:
          PROMOTION_TAGS: ${{ steps.meta.outputs.tags }}
          CANDIDATE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -eu
          candidate="${REGISTRY}/${IMAGE_NAME}@${CANDIDATE_DIGEST}"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create --tag "$tag" "$candidate"
          done <<EOF
          ${PROMOTION_TAGS}
          EOF

      - name: Verify pushed candidate attestations
        if: github.event_name != 'pull_request'
        env:
          SERVER_DIGEST: ${{ steps.image.outputs.digest }}
          UI_DIGEST: ${{ needs.ui-image.outputs.ui_digest }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/release-manifest"
          verify_attestations() {
            image=$1
            digest=$2
            name=$3
            index="$RUNNER_TEMP/release-manifest/${name}-index.json"
            evidence="$RUNNER_TEMP/release-manifest/${name}-attestations.json"
            docker buildx imagetools inspect --raw "${image}@${digest}" > "$index"
            jq -e '[.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length >= 2' "$index" >/dev/null
            : > "$evidence"
            for attestation in $(jq -r '.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest") | .digest' "$index"); do
              docker buildx imagetools inspect --raw "${image}@${attestation}" >> "$evidence"
            done
            grep -q 'https://slsa.dev/provenance/v1' "$evidence"
            grep -q 'https://spdx.dev/Document' "$evidence"
            sha256sum "$index" > "$index.sha256"
            sha256sum "$evidence" > "$evidence.sha256"
          }
          verify_attestations "${REGISTRY}/${IMAGE_NAME}" "$SERVER_DIGEST" server
          verify_attestations "${REGISTRY}/${IMAGE_NAME}-ui" "$UI_DIGEST" ui

      - name: Write candidate release manifest
        env:
          SERVER_DIGEST: ${{ steps.image.outputs.digest }}
          UI_DIGEST: ${{ needs.ui-image.outputs.ui_digest }}
          PLUGIN_LOCK_SHA256: ${{ needs.python-plugin-contract.outputs.plugin_lock_sha256 }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/release-manifest"
          server_attestation_hash=not-published-on-pull-request
          ui_attestation_hash=not-published-on-pull-request
          server_evidence_hash=not-published-on-pull-request
          ui_evidence_hash=not-published-on-pull-request
          attestation_status=not-published-on-pull-request
          if [ -f "$RUNNER_TEMP/release-manifest/server-index.json.sha256" ]; then
            server_attestation_hash=$(awk '{print $1}' "$RUNNER_TEMP/release-manifest/server-index.json.sha256")
            ui_attestation_hash=$(awk '{print $1}' "$RUNNER_TEMP/release-manifest/ui-index.json.sha256")
            server_evidence_hash=$(awk '{print $1}' "$RUNNER_TEMP/release-manifest/server-attestations.json.sha256")
            ui_evidence_hash=$(awk '{print $1}' "$RUNNER_TEMP/release-manifest/ui-attestations.json.sha256")
            attestation_status=verified-slsa-provenance-and-spdx-sbom
          fi
          cat > "$RUNNER_TEMP/release-manifest/release.json" <<EOF
          {
            "schema_version": 1,
            "git_commit": "${GITHUB_SHA}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "workflow_attempt": "${GITHUB_RUN_ATTEMPT}",
            "server_image_digest": "${SERVER_DIGEST}",
            "ui_image_digest": "${UI_DIGEST}",
            "plugin_lock_sha256": "${PLUGIN_LOCK_SHA256}",
            "tested_platforms": "${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}",
            "dependency_audit": "passed",
            "image_scan": "passed",
            "attestation_status": "${attestation_status}",
            "server_attestation_index_sha256": "${server_attestation_hash}",
            "ui_attestation_index_sha256": "${ui_attestation_hash}",
            "server_attestation_evidence_sha256": "${server_evidence_hash}",
            "ui_attestation_evidence_sha256": "${ui_evidence_hash}",
            "mandatory_lanes": "python-quality,python-contract-tests,python-integration-tests,postgres-race-tests,python-package,python-plugin-contract,python-plugin-integration,python-native-iceberg,dependency-audit,jvm,governance-ui,ui-image"
          }
          EOF
          sha256sum "$RUNNER_TEMP/release-manifest/release.json" > "$RUNNER_TEMP/release-manifest/release.json.sha256"

      - name: Upload candidate release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ github.sha }}
          path: ${{ runner.temp }}/release-manifest
          if-no-files-found: error
