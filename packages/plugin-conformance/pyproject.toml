[project]
name = "dal-obscura-plugin-conformance"
version = "0.1.0"
description = "Conformance checks for Dal Obscura public plugin contracts"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dal-obscura-plugin-api==0.1.0",
  "pyarrow>=15.0.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
