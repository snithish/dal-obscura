[project]
name = "dal-obscura-plugin-conformance"
version = "0.3.0"
description = "Conformance checks for Dal Obscura public plugin contracts"
requires-python = ">=3.14,<3.15"
dependencies = [
  "dal-obscura-plugin-api==0.3.0",
  "pyarrow>=15.0.0",
]

[project.optional-dependencies]
native = ["pyspark==4.0.1", "pyiceberg[sql-sqlite]==0.11.1"]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"
