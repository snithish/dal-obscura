[project]
name = "dal-obscura-plugin-api"
version = "0.1.0"
description = "Versioned contracts for Dal Obscura catalog and table-format plugins"
requires-python = ">=3.10"
dependencies = ["pyarrow>=15.0.0"]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
