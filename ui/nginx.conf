map $sent_http_content_type $shell_cache_control {
    default "";
    ~text/html "no-store";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver __OBSCURA_NGINX_RESOLVER__ valid=10s ipv6=off;
    set $control_plane_upstream http://control-plane:8820;

    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'nonce-$request_id'; style-src-attr 'none'; script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control $shell_cache_control always;
    # Generated by NGINX, never taken from an incoming request header.
    sub_filter '__OBSCURA_STYLE_NONCE__' $request_id;
    sub_filter_once on;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location /v1/ {
        proxy_pass $control_plane_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite inherited forwarding metadata. The control plane only
        # trusts this value when its direct peer is explicitly configured.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location /auth/ {
        proxy_pass $control_plane_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # Vite fingerprints built assets. They can remain cached across deployments;
    # a missing asset must stay a 404 instead of receiving the SPA document.
    location /assets/ {
        try_files $uri =404;
        expires max;
    }

    # The shell points at the current content-hashed asset names.
    location = /index.html {
        expires -1;
        etag off;
        if_modified_since off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
